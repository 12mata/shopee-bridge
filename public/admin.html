<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Admin</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;background:#eef4f7;color:#13232c}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px}h2{font-size:16px;margin:22px 0 8px}
.box{background:#fff;border:1px solid #d8e3e9;border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:#566b77;margin:8px 0 3px}
input,textarea,select{width:100%;padding:9px;border:1px solid #c5d3db;border-radius:8px;font:inherit;box-sizing:border-box}
textarea{min-height:60px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
button{padding:10px 16px;border:0;border-radius:8px;background:#0d2b3a;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.y{background:#ffc21a;color:#0d2b3a}button.x{background:#fff;color:#b00020;border:1px solid #e3b5bd}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.th{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#dbe9f0}
.tag{font-weight:700;color:#17435a}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#0d2b3a;color:#fff;padding:10px 16px;border-radius:10px;display:none}
</style></head><body><main>
<h1>Admin halaman Shopee</h1>
<div class="box row">
  <select id="pages" style="flex:1"></select>
  <button onclick="load(pages.value)">Buka</button>
  <input id="newslug" placeholder="slug baru, mis. hujan" style="flex:1">
  <button class="y" onclick="newPage()">Buat baru</button>
</div>
<details class="box"><summary><b>Pengaturan beranda ( / )</b></summary>
<div class="g"><div><label>Nama etalase</label><input id="s_brand"></div><div><label>Meta Pixel ID (kosong = ikut halaman pertama)</label><input id="s_pixel"></div><div><label>Prefix Sub_ID beranda</label><input id="s_prefix" value="home"></div><div><label>Teks banner (hanya isi yang benar-benar berlaku)</label><input id="s_banner"></div></div>
<label>Judul SEO beranda</label><input id="s_seotitle" maxlength="90"><label>Meta description beranda</label><textarea id="s_seodesc" maxlength="200"></textarea><br><button class="y" onclick="saveSite()">Simpan beranda</button></details>
<div id="ed" hidden>
 <h2>Halaman: <span id="cur" class="tag"></span> <a id="open" target="_blank" href="#">lihat</a></h2>
 <div class="box"><div class="g">
  <div><label>Meta Pixel ID</label><input id="pixelId"></div>
  <div><label>Prefix Sub_ID (mis. meta_hujan_vid1)</label><input id="subIdPrefix"></div>
  <div><label>Nama parameter Sub_ID</label><input id="subIdParam" value="site_id"></div>
  <div><label>Nama brand (atas halaman)</label><input id="brand"></div></div>
  <label>Judul SEO (tab browser &amp; hasil Google, sekitar 60 karakter)</label><input id="seoTitle" maxlength="90">
  <label>Meta description (sekitar 150 karakter)</label><textarea id="seoDesc" maxlength="200"></textarea>
  <label>Headline (samakan dengan hook video)</label><input id="headline">
  <label>Sub-headline</label><input id="sub">
  <label>Keunggulan (1 baris = 1 poin, maks 3)</label><textarea id="benefits"></textarea>
  <label>Teks tombol produk utama</label><input id="cta" value="Beli produk ini di Shopee">
  <label>Judul bagian produk lain</label><input id="moreTitle" value="Pilihan lain yang cocok">
  <label><input type="checkbox" id="showHome" checked style="width:auto"> Tampilkan produk halaman ini di beranda</label>
  <label>Ulasan asli (1 baris: Nama | isi ulasan). Kosongkan jika belum ada.</label><textarea id="reviews"></textarea>
 </div>
 <h2>Produk (yang pertama = produk utama / hero)</h2>
 <div class="row" style="margin-bottom:10px"><label style="margin:0">Impor hasil ekstensi (.json): <input type="file" id="imp" accept=".json" style="width:auto"></label></div>
 <div id="prods"></div>
 <div class="row"><button onclick="addProd()">+ Tambah produk</button><button class="y" onclick="save()">Simpan</button><button class="x" onclick="del()">Hapus halaman</button></div>
</div>
<div id="msg"></div>
<script>
const $=id=>document.getElementById(id);
const F=[['link','Link afiliasi lengkap'],['name','Nama produk'],['price','Harga (angka)','number'],['oldPrice','Harga coret (opsional)','number'],['rating','Rating (mis. 4.9)'],['sold','Terjual (mis. 10rb+ terjual)'],['store','Toko (Shopee Mall / Star+)'],['cat','Kategori (untuk beranda & filter)'],['desc','Deskripsi singkat']];
let slug='';
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2500)}
async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()}
async function refresh(){const l=await api('/api/admin/pages');$('pages').innerHTML=l.map(s=>`<option>${s}</option>`).join('')}
function newPage(){const s=$('newslug').value.trim().toLowerCase().replace(/[^\w-]/g,'');if(!s)return;slug=s;fill({});}
async function load(s){if(!s)return;slug=s;fill(await api('/api/admin/page/'+s))}
function fill(c){
  $('ed').hidden=false;$('cur').textContent=slug;$('open').href='/'+slug;
  const h=c.hero||{};
  ['pixelId','subIdPrefix','subIdParam','brand','moreTitle'].forEach(k=>{if(c[k]!=null)$(k).value=c[k]});
  $('headline').value=h.headline||'';$('sub').value=h.sub||'';$('cta').value=h.cta||$('cta').value;
  $('showHome').checked=c.showHome!==false;$('seoTitle').value=c.seoTitle||'';$('seoDesc').value=c.seoDesc||'';
  $('benefits').value=(h.benefits||[]).join('\n');
  $('reviews').value=(c.reviews||[]).map(r=>r.name+' | '+r.text).join('\n');
  $('prods').innerHTML='';
  const all=c.hero?[h].concat(c.products||[]):[];
  all.forEach(addProd);if(!all.length)addProd();
}
async function conv(blob){
  const bm=await createImageBitmap(blob),s=Math.min(1,800/Math.max(bm.width,bm.height));
  const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/webp',.8));
  return (await api('/api/admin/img',{method:'POST',headers:{'content-type':b.type},body:b})).url;
}
function addProd(p){
  p=p&&p.name!==undefined?p:{};
  const d=document.createElement('div');d.className='box';
  d._imgs=(p.imgs&&p.imgs.length?p.imgs:(p.img?[p.img]:[])).slice();
  const first=!$('prods').children.length;
  d.innerHTML=`<div class="row"><span class="tag">${first?'Produk utama':'Produk pendukung'}</span><button class="x" style="margin-left:auto" onclick="this.closest('.box').remove()">Hapus</button></div>
  <label>URL gambar dari Shopee (tempel banyak, 1 per baris; gambar pertama = gambar utama)</label>
  <textarea class="urls" placeholder="https://down-id.img.susercontent.com/file/..."></textarea>
  <div class="row"><button class="go">Ambil &amp; ubah ke WebP</button><span>atau upload file:</span><input type="file" accept="image/*" multiple style="width:auto"></div>
  <div class="row thumbs"></div><div class="g">`+
  F.map(([k,l,t])=>`<div><label>${l}</label><input data-k="${k}" type="${t||'text'}" value="${(p[k]??'').toString().replace(/"/g,'&quot;')}"></div>`).join('')+'</div>';
  const th=d.querySelector('.thumbs');
  const draw=()=>{th.innerHTML=d._imgs.map((u,i)=>`<span><img class="th" src="${u}"><br><a href="#" data-i="${i}">hapus</a></span>`).join('')};
  th.onclick=e=>{const a=e.target.closest('a[data-i]');if(!a)return;e.preventDefault();d._imgs.splice(+a.dataset.i,1);draw()};
  draw();
  d.querySelector('.go').onclick=async()=>{
    const ta=d.querySelector('.urls'),urls=ta.value.split(/\s+/).filter(u=>/^https?:\/\//.test(u));
    let ok=0,bad=0;
    for(const u of urls){toast(`Memproses ${ok+bad+1}/${urls.length}...`);
      try{const r=await fetch('/api/admin/fetch-img?url='+encodeURIComponent(u));if(!r.ok)throw 0;d._imgs.push(await conv(await r.blob()));ok++;draw()}catch(e){bad++}}
    ta.value='';toast(`${ok} gambar berhasil`+(bad?`, ${bad} gagal (coba upload file)`:''));
  };
  d.querySelector('input[type=file]').onchange=async e=>{
    let n=0;for(const f of e.target.files){try{d._imgs.push(await conv(f));n++;draw()}catch(x){}}
    toast(n+' gambar terunggah');
  };
  $('prods').appendChild(d);
}
async function loadSite(){try{const s=await api('/api/admin/site');$('s_brand').value=s.brand||'';$('s_seotitle').value=s.seoTitle||'';$('s_seodesc').value=s.seoDesc||'';$('s_pixel').value=s.pixelId||'';$('s_prefix').value=s.subIdPrefix||'home';$('s_banner').value=s.banner||''}catch(e){}}
async function saveSite(){try{await api('/api/admin/site',{method:'PUT',body:JSON.stringify({brand:$('s_brand').value,seoTitle:$('s_seotitle').value.trim(),seoDesc:$('s_seodesc').value.trim(),pixelId:$('s_pixel').value.trim(),subIdPrefix:$('s_prefix').value.trim()||'home',banner:$('s_banner').value})});toast('Beranda tersimpan')}catch(e){toast('Gagal simpan')}}
function collect(){
  const rows=[...$('prods').children].map((d,i)=>{const o={};d.querySelectorAll('[data-k]').forEach(el=>{let v=el.value.trim();if(el.type==='number')v=v?Number(v):null;o[el.dataset.k]=v});o.id=i?'p'+i:'hero1';o.imgs=d._imgs||[];o.img=o.imgs[0]||'';return o});
  const hero=rows[0]||{};
  Object.assign(hero,{headline:$('headline').value,sub:$('sub').value,cta:$('cta').value,benefits:$('benefits').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,3)});
  return{pixelId:$('pixelId').value.trim(),subIdParam:$('subIdParam').value.trim()||'site_id',subIdPrefix:$('subIdPrefix').value.trim(),brand:$('brand').value,pageTitle:$('brand').value,seoTitle:$('seoTitle').value.trim(),seoDesc:$('seoDesc').value.trim(),
    moreTitle:$('moreTitle').value,moreLead:'',showHome:$('showHome').checked,hero,products:rows.slice(1),
    reviews:$('reviews').value.split('\n').filter(l=>l.includes('|')).map(l=>{const[n,...t]=l.split('|');return{name:n.trim(),text:t.join('|').trim(),source:'Ulasan pembeli di Shopee'}})};
}
async function save(){try{await api('/api/admin/page/'+slug,{method:'PUT',body:JSON.stringify(collect())});toast('Tersimpan');refresh()}catch(e){toast('Gagal simpan')}}
async function del(){if(!confirm('Hapus halaman '+slug+'?'))return;await api('/api/admin/page/'+slug,{method:'DELETE'});$('ed').hidden=true;refresh()}
$('imp').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const arr=JSON.parse(await f.text());
    [...$('prods').children].forEach(d=>{const v=k=>d.querySelector('[data-k='+k+']').value;if(!v('name')&&!v('link')&&!(d._imgs||[]).length)d.remove()});
    arr.forEach(it=>{
      addProd({name:it.name,price:it.price,oldPrice:it.oldPrice,rating:it.rating,sold:it.sold,store:it.store,cat:it.cat,desc:it.desc});
      $('prods').lastChild.querySelector('.urls').value=(it.images||[]).join('\n');
    });
    toast(arr.length+' produk diimpor. Isi link afiliasi tiap produk.');
  }catch(x){toast('File tidak valid')}
  e.target.value='';
};
loadSite();refresh().then(()=>load($('pages').value));
</script></main></body></html>
