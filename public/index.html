<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2b3a">
<title>Perlengkapan Hujan Pilihan</title>
<meta name="description" content="Pilihan perlengkapan hujan terbaik dari toko resmi Shopee.">
<style>
:root{
  --ink:#0d2b3a; --ink2:#17435a; --rain:#8cc3dc; --mist:#eef4f7; --paper:#fff;
  --sun:#ffc21a; --sun-d:#e6a800; --text:#13232c; --muted:#566b77; --line:#d8e3e9;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);background:var(--mist);line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{width:100%;max-width:960px;margin:0 auto;padding:0 16px}

/* draft banner */
.draft{background:var(--sun);color:var(--ink);font-size:13px;font-weight:700;text-align:center;padding:8px 12px}

/* hero */
.hero{
  background:var(--ink);color:#fff;
  background-image:repeating-linear-gradient(105deg,rgba(255,255,255,.055) 0 1px,transparent 1px 15px);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 0 28px;
}
.brand{font-size:14px;font-weight:700;color:var(--rain);letter-spacing:.01em;margin-bottom:14px}
.hero-grid{display:grid;gap:18px}
h1{font-size:clamp(28px,7.4vw,44px);line-height:1.08;font-weight:850;letter-spacing:-.025em;max-width:16ch}
.sub{margin-top:10px;color:#cfe1ea;font-size:16px;max-width:38ch}
.benefits{list-style:none;margin-top:14px;display:grid;gap:6px;font-size:15px;color:#e8f2f7}
.benefits li{padding-left:24px;position:relative}
.benefits li::before{content:"";position:absolute;left:0;top:.5em;width:12px;height:7px;border-left:2.5px solid var(--sun);border-bottom:2.5px solid var(--sun);transform:rotate(-45deg) translateY(-50%)}

.hero-card{background:var(--paper);color:var(--text);border-radius:var(--r-lg);padding:12px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.hero-card .pic{aspect-ratio:1/1;border-radius:var(--r-md);overflow:hidden;background:var(--mist)}
.hero-card .pic img{width:100%;height:100%;object-fit:cover}
.hero-card h2{font-size:18px;line-height:1.3;margin:12px 4px 2px;font-weight:750}
.price-row{display:flex;align-items:baseline;gap:10px;margin:2px 4px 8px;flex-wrap:wrap}
.price{font-size:28px;font-weight:850;letter-spacing:-.02em;color:var(--ink)}
.was{color:var(--muted);text-decoration:line-through;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 4px 12px}
.chip{font-size:13px;font-weight:600;background:var(--mist);border-radius:99px;padding:4px 10px;color:var(--ink2)}

.cta{
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:54px;padding:12px 18px;border-radius:var(--r-md);
  background:var(--sun);color:var(--ink);font-weight:800;font-size:17px;text-decoration:none;
  box-shadow:0 3px 0 var(--sun-d);transition:transform .08s;
}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-d)}
.cta.sm{min-height:44px;font-size:15px;padding:8px 12px;box-shadow:0 2px 0 var(--sun-d)}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}

/* sections */
section{padding:30px 0 6px}
h3{font-size:22px;font-weight:800;letter-spacing:-.015em;margin-bottom:4px}
.lead{color:var(--muted);font-size:15px;margin-bottom:14px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{
  flex:0 0 auto;border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);
  padding:7px 14px;border-radius:99px;font-weight:650;font-size:14px;min-height:38px;
}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--paper);border-radius:var(--r-md);padding:8px;display:flex;flex-direction:column;border:1px solid var(--line)}
.card .pic{aspect-ratio:1/1;border-radius:var(--r-sm);overflow:hidden;background:var(--mist)}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card h4{font-size:14px;line-height:1.3;font-weight:650;margin:8px 2px 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .p{font-size:17px;font-weight:800;color:var(--ink);margin:2px 2px 0}
.card .m{font-size:12.5px;color:var(--muted);margin:0 2px 8px}
.card .acts{margin-top:auto;display:grid;gap:6px}
.ghost{
  background:transparent;border:1.5px solid var(--line);color:var(--ink2);
  border-radius:var(--r-sm);min-height:40px;font-weight:650;font-size:14px
}
.detail{font-size:13.5px;color:var(--text);background:var(--mist);border-radius:var(--r-sm);padding:9px 10px;margin:2px 0 4px}
.detail[hidden]{display:none}
.card[hidden]{display:none}

/* reviews */
.reviews{display:grid;gap:10px}
.rev{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.rev p{font-size:15px}
.rev small{display:block;margin-top:8px;color:var(--muted);font-size:13px}

footer{padding:30px 0 96px;color:var(--muted);font-size:12.5px}
footer p+p{margin-top:6px}

/* sticky bar */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex;gap:12px;align-items:center;justify-content:center;
  transform:translateY(110%);transition:transform .25s ease;
}
.bar.on{transform:none}
.bar .t{min-width:0;flex:1;max-width:360px}
.bar .t b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{font-weight:850;color:var(--ink);font-size:16px}
.bar .cta{flex:0 0 auto;min-height:46px;font-size:15px;padding:8px 18px}

@media (min-width:760px){
  .hero-grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:36px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .reviews{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}.bar,.cta{transition:none}
}
</style>
</head>
<body>

<div id="draft" class="draft" hidden>MODE DRAFT: ganti data placeholder (link Shopee, Pixel ID, harga, foto) di blok CONFIG sebelum dipakai iklan.</div>

<header class="hero">
  <div class="wrap">
    <p class="brand" id="brand"></p>
    <div class="hero-grid">
      <div>
        <h1 id="h1"></h1>
        <p class="sub" id="sub"></p>
        <ul class="benefits" id="benefits"></ul>
      </div>
      <article class="hero-card" id="heroCard"></article>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="moreSec">
    <h3 id="moreTitle"></h3>
    <p class="lead" id="moreLead"></p>
    <div class="filters" id="filters" role="group" aria-label="Kategori produk"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="revSec" hidden>
    <h3>Kata pembeli</h3>
    <p class="lead">Ulasan asli dari halaman produk di Shopee.</p>
    <div class="reviews" id="reviews"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p id="disclosure"></p>
    <p>Harga, stok, dan promo dapat berubah sewaktu-waktu mengikuti halaman produk di Shopee.</p>
  </div>
</footer>

<div class="bar" id="bar" aria-hidden="true">
  <div class="t"><b id="barName"></b><span id="barPrice"></span></div>
  <a class="cta" id="barCta" data-cta rel="nofollow sponsored noopener" tabindex="-1">Cek promo di Shopee</a>
</div>

<script>
/* ============================================================
   CONFIG: satu-satunya bagian yang perlu diedit per niche/halaman
   ============================================================ */
const DEFAULT_CONFIG = {
  pixelId: "ISI_PIXEL_ID",          // contoh: "1234567890123456"
  subIdParam: "site_id",            // nama parameter Sub_ID (sesuai brief)
  subIdPrefix: "meta_hujan_vid1",   // identitas materi iklan; ditambah _utama / _alt1 / _alt2 ...
  brand: "Pilihan Perlengkapan Hujan",
  pageTitle: "Perlengkapan Hujan Pilihan | Toko Resmi Shopee",
  disclosure: "Halaman ini berisi tautan afiliasi Shopee. Jika kamu membeli lewat tautan ini, kami bisa menerima komisi tanpa biaya tambahan untukmu.",

  hero: {
    // headline HARUS sama dengan hook video iklan
    headline: "Hujan deras, tetap kering sampai tujuan",
    sub: "Satu pilihan yang paling sering dibeli, langsung dari toko resmi Shopee.",
    benefits: ["Bahan anti bocor, tidak tembus air", "Ringan, muat di jok motor", "Pengiriman cepat dari toko terpercaya"],
    id: "hero1",
    name: "GANTI: Nama Produk Utama",
    price: 99000,
    oldPrice: 149000,              // isi null jika tidak ada
    rating: 4.9,                   // GANTI dengan data asli
    sold: "10rb+ terjual",         // GANTI dengan data asli
    store: "Shopee Mall",          // atau "Star+"
    img: "img/hero.jpg",           // taruh foto sendiri di public/img/ (kompres, < 80 KB)
    link: "#",                     // GANTI: link affiliate lengkap produk utama
    cta: "Beli produk ini di Shopee"
  },

  products: [
    { id:"p1", cat:"Jas hujan",  name:"GANTI: Produk pendukung 1", price:85000,  rating:4.8, sold:"5rb+ terjual", img:"img/p1.jpg", link:"#", desc:"GANTI: 1-2 kalimat keunggulan produk." },
    { id:"p2", cat:"Jas hujan",  name:"GANTI: Produk pendukung 2", price:120000, rating:4.9, sold:"3rb+ terjual", img:"img/p2.jpg", link:"#", desc:"GANTI: 1-2 kalimat keunggulan produk." },
    { id:"p3", cat:"Aksesori",   name:"GANTI: Produk pendukung 3", price:65000,  rating:4.8, sold:"8rb+ terjual", img:"img/p3.jpg", link:"#", desc:"GANTI: 1-2 kalimat keunggulan produk." },
    { id:"p4", cat:"Aksesori",   name:"GANTI: Produk pendukung 4", price:75000,  rating:4.9, sold:"2rb+ terjual", img:"img/p4.jpg", link:"#", desc:"GANTI: 1-2 kalimat keunggulan produk." }
  ],

  moreTitle: "Pilihan lain yang cocok",
  moreLead: "Kalau yang di atas belum pas, ini produk lain dari toko yang sama-sama terpercaya.",

  // Isi HANYA dengan ulasan asli dari halaman produk Shopee. Kosongkan array = bagian ini disembunyikan.
  reviews: [
    // { name:"Budi", text:"Isi ulasan asli...", source:"Ulasan pembeli di Shopee" }
  ]
};
/* ============================ END CONFIG ============================ */

function boot(C){
  var H = C.hero;
  var $ = function(s){return document.querySelector(s)};
  var esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var rp = function(n){return "Rp\u00a0"+Number(n).toLocaleString("id-ID")};
  var pixelOn = /^\d{10,20}$/.test(C.pixelId);

  /* ---- placeholder gambar bila file belum ada ---- */
  function ph(name){
    var t = esc((name||"?").replace(/^GANTI:\s*/,"").trim().charAt(0).toUpperCase()||"?");
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23dbe9f0'/><text x='100' y='122' font-size='84' text-anchor='middle' fill='%2317435a' font-family='sans-serif' font-weight='700'>"+t+"</text></svg>";
    return "data:image/svg+xml;utf8,"+svg.replace(/#/g,"%23");
  }
  function imgTag(src,name,hero){
    return '<img src="'+esc(src)+'" alt="'+esc(name)+'" '+(hero?'fetchpriority="high" width="600" height="600"':'loading="lazy" width="300" height="300"')+' decoding="async" onerror="this.onerror=null;this.src=\''+ph(name).replace(/'/g,"%27")+'\'">';
  }

  /* ---- link + Sub_ID ---- */
  function build(link,suffix){
    if(!link || link==="#") return "#";
    try{
      var u = new URL(link);
      u.searchParams.set(C.subIdParam, C.subIdPrefix+"_"+suffix);
      return u.toString();
    }catch(e){ return link; }
  }

  /* ---- Meta Pixel (hanya jika ID valid) ---- */
  if(pixelOn){
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq("init",C.pixelId);
    fbq("track","PageView");
  }

  /* ---- render ---- */
  document.title = C.pageTitle;
  $("#brand").textContent = C.brand;
  $("#h1").textContent = H.headline;
  $("#sub").textContent = H.sub;
  $("#benefits").innerHTML = H.benefits.map(function(b){return "<li>"+esc(b)+"</li>"}).join("");
  $("#disclosure").textContent = C.disclosure;
  $("#moreTitle").textContent = C.moreTitle;
  $("#moreLead").textContent = C.moreLead;

  var heroUrl = build(H.link,"utama");
  var chips = ['<span class="chip">\u2605 '+esc(H.rating)+'</span>','<span class="chip">'+esc(H.sold)+'</span>','<span class="chip">'+esc(H.store)+'</span>'].join("");
  $("#heroCard").innerHTML =
    '<div class="pic">'+imgTag(H.img,H.name,true)+'</div>'+
    '<h2>'+esc(H.name)+'</h2>'+
    '<div class="price-row"><span class="price">'+rp(H.price)+'</span>'+(H.oldPrice?'<span class="was">'+rp(H.oldPrice)+'</span>':'')+'</div>'+
    '<div class="chips">'+chips+'</div>'+
    '<a class="cta" id="heroCta" href="'+esc(heroUrl)+'" data-cta data-id="'+esc(H.id)+'" data-name="'+esc(H.name)+'" rel="nofollow sponsored noopener">'+esc(H.cta)+'</a>'+
    '<p class="note">Kamu akan diarahkan ke aplikasi Shopee</p>';

  var cats = [];
  C.products.forEach(function(p){ if(cats.indexOf(p.cat)<0) cats.push(p.cat); });
  $("#filters").innerHTML = ['Semua'].concat(cats).map(function(c,i){
    return '<button type="button" data-cat="'+esc(i?c:"")+'" aria-pressed="'+(i===0)+'">'+esc(c)+'</button>';
  }).join("");
  if(cats.length<2) $("#filters").hidden = true;

  $("#grid").innerHTML = C.products.map(function(p,i){
    var url = build(p.link,"alt"+(i+1));
    return '<article class="card" data-cat="'+esc(p.cat)+'">'+
      '<div class="pic">'+imgTag(p.img,p.name,false)+'</div>'+
      '<h4>'+esc(p.name)+'</h4>'+
      '<div class="p">'+rp(p.price)+'</div>'+
      '<div class="m">\u2605 '+esc(p.rating)+' \u00b7 '+esc(p.sold)+'</div>'+
      '<div class="detail" id="d-'+esc(p.id)+'" hidden>'+esc(p.desc)+'</div>'+
      '<div class="acts">'+
        '<button type="button" class="ghost" data-detail="d-'+esc(p.id)+'" aria-expanded="false">Lihat detail</button>'+
        '<a class="cta sm" href="'+esc(url)+'" data-cta data-id="'+esc(p.id)+'" data-name="'+esc(p.name)+'" rel="nofollow sponsored noopener">Beli di Shopee</a>'+
      '</div></article>';
  }).join("");

  if(C.reviews && C.reviews.length){
    $("#revSec").hidden = false;
    $("#reviews").innerHTML = C.reviews.map(function(r){
      return '<blockquote class="rev"><p>'+esc(r.text)+'</p><small>'+esc(r.name)+' \u00b7 '+esc(r.source||"Ulasan di Shopee")+'</small></blockquote>';
    }).join("");
  }

  /* sticky bar */
  $("#barName").textContent = H.name;
  $("#barPrice").textContent = rp(H.price);
  var barCta = $("#barCta");
  barCta.href = heroUrl; barCta.dataset.id = H.id; barCta.dataset.name = H.name;
  var bar = $("#bar");
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(en){
      var on = !en[0].isIntersecting && en[0].boundingClientRect.top < 0;
      bar.classList.toggle("on",on);
      bar.setAttribute("aria-hidden",String(!on));
      barCta.tabIndex = on?0:-1;
    },{threshold:0}).observe($("#heroCta"));
  }

  /* draft banner */
  var isDraft = !pixelOn || heroUrl==="#" || /GANTI/.test(H.name);
  $("#draft").hidden = !isDraft;

  /* ---- interaksi: filter & detail ---- */
  $("#filters").addEventListener("click",function(e){
    var b = e.target.closest("button"); if(!b) return;
    var c = b.dataset.cat;
    document.querySelectorAll("#filters button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});
    document.querySelectorAll("#grid .card").forEach(function(card){card.hidden = !!c && card.dataset.cat!==c});
  });
  $("#grid").addEventListener("click",function(e){
    var b = e.target.closest("[data-detail]"); if(!b) return;
    var d = document.getElementById(b.dataset.detail);
    var open = d.hidden;
    d.hidden = !open;
    b.setAttribute("aria-expanded",String(open));
    b.textContent = open ? "Tutup detail" : "Lihat detail";
  });

  /* ---- CTA: Pixel -> jeda 250ms -> redirect, dengan anti double-fire ---- */
  var locked = false;
  window.addEventListener("pageshow",function(){ locked = false; }); // reset saat user kembali dari Shopee
  document.addEventListener("click",function(e){
    var a = e.target.closest("a[data-cta]"); if(!a) return;
    e.preventDefault();
    var url = a.href;
    if(a.getAttribute("href")==="#" || url.slice(-1)==="#") return; // draft: tidak ada tujuan
    if(locked) return;
    locked = true;
    var delay = 0;
    try{
      if(pixelOn && typeof fbq==="function"){
        fbq("track","InitiateCheckout",{
          content_name:a.dataset.name, content_ids:[a.dataset.id], content_type:"product", currency:"IDR"
        },{eventID:"ic_"+Date.now()+"_"+Math.random().toString(36).slice(2,8)});
        delay = 250;
      }
    }catch(err){}
    setTimeout(function(){ window.location.href = url; }, delay);
    setTimeout(function(){ locked = false; }, 3000); // pengaman jika redirect gagal
  });
}
var INJECTED = /*__DATA__*/null;
boot(INJECTED || DEFAULT_CONFIG);
</script>
</body>
</html>
